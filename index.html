<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Gorivo.me — Cijene goriva na Balkanu</title>
<meta name="description" content="Zvanične cijene goriva u Crnoj Gori, Srbiji, BiH, Hrvatskoj i Albaniji.">
<meta name="theme-color" content="#dc2626">
<style>
:root{--red:#dc2626;--red-light:#fee2e2;--green:#059669;--green-light:#d1fae5;--blue:#2563eb;--blue-light:#dbeafe;--orange:#ea580c;--orange-light:#ffedd5;--gray-50:#f9fafb;--gray-100:#f3f4f6;--gray-200:#e5e7eb;--gray-400:#9ca3af;--gray-500:#6b7280;--gray-600:#4b5563;--gray-700:#374151;--gray-900:#111827;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--gray-50);color:var(--gray-900);line-height:1.5;-webkit-font-smoothing:antialiased}
.header{background:#fff;border-bottom:1px solid var(--gray-200);position:sticky;top:0;z-index:100}
.header-inner{max-width:1200px;margin:0 auto;padding:0 16px;display:flex;align-items:center;justify-content:space-between;height:56px}
.logo{display:flex;align-items:center;gap:8px;text-decoration:none}
.logo-icon{width:32px;height:32px;background:var(--red);border-radius:8px;display:flex;align-items:center;justify-content:center;color:white;font-size:18px}
.logo-title{font-size:16px;font-weight:700;color:var(--gray-900)}
.logo-subtitle{font-size:10px;color:var(--gray-500)}
.nav{display:none;gap:24px;list-style:none}
.nav a{text-decoration:none;color:var(--gray-600);font-size:14px;font-weight:500;padding:8px 0;border-bottom:2px solid transparent;transition:all .2s}
.nav a:hover,.nav a.active{color:var(--red);border-bottom-color:var(--red)}
.header-actions{display:flex;align-items:center;gap:8px}
.select-box{padding:6px 10px;border:1px solid var(--gray-200);border-radius:8px;font-size:13px;background:#fff;cursor:pointer;font-family:inherit;min-width:120px}

.hero{position:relative;min-height:340px;display:flex;align-items:center;overflow:hidden}
.hero-bg{position:absolute;inset:0;background:url('images/boka.jpg') center/cover}
.hero-overlay{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,0.35) 0%,rgba(0,0,0,0.15) 50%,rgba(0,0,0,0.55) 100%)}

.hero-flag-desktop{display:none;position:absolute;right:5%;top:50%;transform:translateY(-50%);width:260px;height:390px;z-index:5}
.hero-flag-desktop img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 12px 32px rgba(0,0,0,0.35))}
.hero-flag-mobile{display:flex;justify-content:center;margin:16px 0}
.hero-flag-mobile img{width:140px;height:210px;object-fit:contain;filter:drop-shadow(0 6px 16px rgba(0,0,0,0.25))}
.flag-waving{animation:wave 3s ease-in-out infinite;transform-origin:left center}
@keyframes wave{0%,100%{transform:perspective(600px) rotateY(0deg) skewX(0deg) scale(1)}25%{transform:perspective(600px) rotateY(10deg) skewX(-4deg) scale(1.02)}50%{transform:perspective(600px) rotateY(0deg) skewX(0deg) scale(1)}75%{transform:perspective(600px) rotateY(-10deg) skewX(4deg) scale(1.02)}}
.hero-content{position:relative;max-width:1200px;margin:0 auto;padding:32px 16px 24px;width:100%;z-index:10;text-align:center}
.hero h1{font-size:28px;font-weight:800;color:#fff;line-height:1.15;margin-bottom:12px;text-shadow:0 2px 12px rgba(0,0,0,0.5)}
.hero p{font-size:15px;color:rgba(255,255,255,0.9);max-width:340px;margin:0 auto 16px;text-shadow:0 1px 6px rgba(0,0,0,0.4)}
.hero .highlight{color:#fbbf24;font-weight:600}
.last-update{display:inline-flex;align-items:center;gap:8px;background:rgba(0,0,0,0.35);padding:10px 16px;border-radius:12px;border:1px solid rgba(255,255,255,0.15);font-size:13px;color:#fff;backdrop-filter:blur(12px);margin:0 auto}
.update-icon{width:32px;height:32px;background:rgba(255,255,255,0.15);border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fbbf24;font-size:16px}

.country-bar{max-width:1200px;margin:0 auto;padding:12px 16px 0;display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center}
.country-bar label{font-size:12px;font-weight:600;color:var(--gray-600);white-space:nowrap}

.prices-section{max-width:1200px;margin:0 auto;padding:16px}
