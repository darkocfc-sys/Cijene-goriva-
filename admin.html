<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin | Gorivo.me</title>
<style>
:root{--red:#dc2626;--green:#059669;--gray-50:#f9fafb;--gray-100:#f3f4f6;--gray-200:#e5e7eb;--gray-500:#6b7280;--gray-700:#374151;--gray-900:#111827;}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--gray-50);display:flex;justify-content:center;align-items:center;min-height:100vh;padding:16px}
.card{background:#fff;border-radius:20px;padding:32px 24px;width:100%;max-width:520px;box-shadow:0 4px 20px rgba(0,0,0,0.08);border:1px solid var(--gray-200)}
.logo{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.logo-icon{width:36px;height:36px;background:var(--red);border-radius:10px;display:flex;align-items:center;justify-content:center;color:white;font-size:20px}
.logo-title{font-size:20px;font-weight:700}
.subtitle{color:var(--gray-500);font-size:14px;margin-bottom:24px}

.country-tabs{display:flex;gap:6px;margin-bottom:20px;flex-wrap:wrap}
.country-tab{padding:8px 12px;border-radius:10px;border:1px solid var(--gray-200);background:#fff;cursor:pointer;font-size:13px;font-weight:600;transition:all .2s}
.country-tab.active{background:var(--red);color:#fff;border-color:var(--red)}
.country-tab:hover:not(.active){background:var(--gray-100)}

.current-prices{background:var(--gray-50);border-radius:12px;padding:16px;margin-bottom:24px}
.current-prices h3{font-size:12px;color:var(--gray-500);margin-bottom:10px;text-transform:uppercase;letter-spacing:.5px}
.price-row{display:flex;justify-content:space-between;padding:6px 0;font-size:14px;border-bottom:1px solid var(--gray-200)}
.price-row:last-child{border-bottom:none}
.price-row .name{color:var(--gray-700);font-weight:500}
.price-row .value{color:var(--gray-900);font-weight:700}

.input-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.input-group{margin-bottom:4px}
.input-group label{display:block;font-size:12px;font-weight:600;color:var(--gray-700);margin-bottom:6px}
.input-group input{width:100%;padding:12px 14px;border:2px solid var(--gray-200);border-radius:12px;font-size:16px;font-weight:600;color:var(--gray-900);transition:border-color .2s}
.input-group input:focus{outline:none;border-color:var(--red)}

.btn{width:100%;padding:14px;background:var(--red);color:white;border:none;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer;transition:all .2s;margin-top:16px}
.btn:hover{background:#b91c1c}
.btn:disabled{background:#9ca3af;cursor:not-allowed}

.status{margin-top:16px;padding:12px 16px;border-radius:10px;font-size:14px;font-weight:500;display:none}
.status.success{background:#d1fae5;color:var(--green);display:block}
.status.error{background:#fee2e2;color:var(--red);display:block}

.source-note{margin-top:20px;font-size:11px;color:var(--gray-500);text-align:center;line-height:1.5}
</style>
</head>
<body>
<div class="card">
  <div class="logo"><div class="logo-icon">⛽</div><span class="logo-title">Gorivo.me</span></div>
  <p class="subtitle">Admin panel — ažuriranje cijena po zemljama</p>

  <div class="country-tabs" id="country-tabs">
    <div class="country-tab active" data-country="me">🇲🇪 CG</div>
    <div class="country-tab" data-country="rs">🇷🇸 SRB</div>
    <div class="country-tab" data-country="ba">🇧🇦 BiH</div>
    <div class="country-tab" data-country="hr">🇭🇷 HR</div>
    <div class="country-tab" data-country="al">🇦🇱 AL</div>
  </div>

  <div class="current-prices" id="current-prices"><h3>Trenutne cijene</h3><div id="prices-list">Učitavanje...</div></div>

  <form id="update-form">
    <div class="input-grid" id="inputs-grid"></div>
    <button type="submit" class="btn" id="submit-btn">💾 Sačuvaj cijene</button>
  </form>

  <div class="status" id="status"></div>
  <p class="source-note">Izvori: gov.me, mondo.rs, cenoskop.si, bihamk.ba, tolls.eu<br>Cijene se ažuriraju sedmično</p>
</div>

<script>
const API_BASE = window.location.origin;
let currentCountry = 'me';
let countryFuels = {};

async function loadCountry(country) {
  currentCountry = country;
  document.querySelectorAll('.country-tab').forEach(t => t.classList.toggle('active', t.dataset.country === country));

  try {
    const res = await fetch(`${API_BASE}/api/prices?country=${country}`);
    const data = await res.json();
    if (data.success) {
      const c = data.data.current;
      countryFuels[country] = c.fuels;

      document.getElementById('prices-list').innerHTML = c.fuels.map(f => `
        <div class="price-row"><span class="name">${f.name}</span><span class="value">${f.price.toFixed(2)} ${c.currency}/L</span></div>
      `).join('');

      const grid = document.getElementById('inputs-grid');
      grid.innerHTML = c.fuels.map((f, i) => `
        <div class="input-group">
          <label>${f.name} (${c.currency}/L)</label>
          <input type="number" step="0.01" name="fuel_${f.id}" value="${f.price.toFixed(2)}" required>
        </div>
      `).join('');
    }
  } catch (e) {
    document.getElementById('prices-list').innerHTML = 'Greška';
  }
}

document.getElementById('country-tabs').addEventListener('click', (e) => {
  if (e.target.classList.contains('country-tab')) {
    loadCountry(e.target.dataset.country);
  }
});

document.getElementById('update-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('submit-btn');
  const status = document.getElementById('status');
  btn.disabled = true; btn.textContent = '⏳ Čuvanje...';

  const fuels = countryFuels[currentCountry].map(f => ({
    id: f.id,
    price: parseFloat(document.querySelector(`[name="fuel_${f.id}"]`).value)
  }));

  try {
    const res = await fetch(`${API_BASE}/api/admin/update`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ country: currentCountry, fuels })
    });
    const data = await res.json();
    status.className = 'status ' + (data.success ? 'success' : 'error');
    status.textContent = data.success ? '✅ Cijene ažurirane!' : '❌ ' + (data.error || 'Greška');
    if (data.success) loadCountry(currentCountry);
  } catch (err) {
    status.className = 'status error'; status.textContent = '❌ Greška u konekciji';
  }
  btn.disabled = false; btn.textContent = '💾 Sačuvaj cijene';
});

loadCountry('me');
</script>
</body>
</html>
